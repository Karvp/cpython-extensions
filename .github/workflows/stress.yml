name: Stress

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      scale:
        description: "Scale for scalable stress harnesses"
        required: false
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: production stress (CPython 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRESS_SCALE: ${{ inputs.scale || '1.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Guarded inline mutation/concurrency stress
        run: python tests/harness_guarded_binding_v102.py --scale "$STRESS_SCALE"
      - name: Application-style public API scenarios
        run: python tests/stress/harness_user_scenarios.py --scale "$STRESS_SCALE"
      - name: Deep generated/registry/control-flow stress
        run: python tests/stress/harness_release_deep.py
      - name: Specialization adversarial stress
        run: python -X dev -W error tests/harness_specialization_v121_adversarial.py --full
      - name: Full live-switch compatibility stress
        run: python -X dev tests/harness_switch_live_v182.py --profile full
      - name: Coordinated extension harness
        run: python tests/harness_all_extensions_v22.py --full
