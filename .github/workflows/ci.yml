name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, CPython 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Repository hygiene
        run: python tools/check_repo.py --allow-dirty-build-output
      - name: Unit and regression suite
        run: python -m pytest
      - name: Compile all Python sources
        run: python -m compileall -q src tests tools
      - name: Dependency consistency
        run: python -m pip check

  dependency-contract:
    name: dependency contract (bytecode 0.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install certified runtime dependency and test tooling
        run: python -m pip install "bytecode==0.17.0" "pytest>=8,<10" "coverage[toml]>=7.6,<8"
      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps -e .
      - name: Confirm certified bytecode line
        run: python -c "import importlib.metadata as m; assert m.version('bytecode') == '0.17.0', m.version('bytecode')"
      - name: Full regression suite on minimum certified runtime dependency
        run: python -m pytest
      - name: Dependency consistency
        run: python -m pip check

  dev-mode:
    name: CPython dev mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Warnings as errors under dev mode
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -X dev -W error -m pytest
      - name: Allocator-debug focused suite
        env:
          PYTHONMALLOC: debug
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -X dev -m pytest tests/test_release_hardening_v101.py tests/test_inline_guarded_binding_v102.py

  coverage:
    name: branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m coverage run --branch -m pytest
      - run: python -m coverage report

  twine-candidate:
    name: Twine 7 compatibility candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Twine 7 candidate tooling
        run: python -m pip install -U "setuptools>=75" "build>=1.2,<2" "twine==7.0.0" "trove-classifiers>=2026.6.1.19"
      - name: Report candidate tooling
        run: python -m twine --version
      - name: Validate PyPI classifiers
        run: python tools/check_metadata.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate metadata with Twine 7
        run: python -m twine check dist/*
      - name: Install exact wheel
        run: python -m pip install --target .twine7-artifact-install dist/*.whl
      - name: Smoke exact wheel
        env:
          PYTHONPATH: .twine7-artifact-install
        run: python tools/smoke_release.py

  package:
    name: release package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Clean-tree release preflight
        run: python tools/check_repo.py
      - name: Validate GitHub Release helper syntax
        run: node --check .github/scripts/publish_release.cjs
      - name: Install declared package-validation dependencies
        run: >-
          python tools/install_dependencies.py
          --include-build-system
          --include-runtime
          --upgrade
          build
      - name: Validate publish metadata
        run: python tools/check_metadata.py
      - name: Report build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m twine --version
          python -m pip check
      - name: Reproducible release build
        shell: bash
        run: |
          set -euo pipefail
          EPOCH=$(git show -s --format=%ct HEAD)
          python tools/build_release.py --out-dir dist-a --epoch "$EPOCH"
          python tools/build_release.py --out-dir dist-b --epoch "$EPOCH"
          cmp dist-a/cpython_extensions-*.whl dist-b/cpython_extensions-*.whl
          cmp dist-a/cpython_extensions-*.tar.gz dist-b/cpython_extensions-*.tar.gz
          cmp dist-a/SHA256SUMS.txt dist-b/SHA256SUMS.txt
          mv dist-a dist
          rm -rf dist-b
      - name: Validate checksums and metadata
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Install exact wheel into isolated target
        run: python -m pip install --target .artifact-install dist/*.whl
      - name: Smoke exact wheel
        env:
          PYTHONPATH: .artifact-install
        run: python tools/smoke_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: ci-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
