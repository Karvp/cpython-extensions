name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: reproducible build and artifact certification
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Run before installing/building anything. Installing the local project
      # creates build metadata that intentionally fails the clean-tree gate.
      - name: Check clean repository and tag version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_repo.py
          VERSION=$(python tools/check_version.py --tag "$GITHUB_REF_NAME")
          CHANNEL=$(python tools/check_version.py --tag "$GITHUB_REF_NAME" --print-channel)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release tag $GITHUB_REF_NAME accepted as $CHANNEL for package $VERSION"

      # Resolve dependencies from pyproject.toml without installing the local
      # package, keeping release source pristine until the deterministic build.
      - name: Install declared release dependencies
        run: >-
          python tools/install_dependencies.py
          --include-build-system
          --include-runtime
          --upgrade
          build test

      - name: Validate publish metadata
        run: python tools/check_metadata.py

      - name: Report release tooling
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m twine --version
          python -m pip check

      - name: Build twice with tagged commit epoch
        id: distributions
        shell: bash
        run: |
          set -euo pipefail
          EPOCH=$(git show -s --format=%ct HEAD)
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"
          python tools/build_release.py --out-dir dist-a --epoch "$EPOCH"
          python tools/build_release.py --out-dir dist-b --epoch "$EPOCH"
          cmp dist-a/cpython_extensions-*.whl dist-b/cpython_extensions-*.whl
          cmp dist-a/cpython_extensions-*.tar.gz dist-b/cpython_extensions-*.tar.gz
          cmp dist-a/SHA256SUMS.txt dist-b/SHA256SUMS.txt
          mv dist-a dist
          rm -rf dist-b

      - name: Verify release checksums
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Validate package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Test exact wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --target .wheel-install dist/*.whl
          PYTHONPATH=.wheel-install python tools/smoke_release.py

      - name: Test and reproduce wheel from exact sdist
        shell: bash
        run: |
          set -euo pipefail
          mkdir .sdist-test
          tar -xzf dist/cpython_extensions-*.tar.gz -C .sdist-test
          SDIST_ROOT=$(find .sdist-test -mindepth 1 -maxdepth 1 -type d -name 'cpython_extensions-*' -print -quit)
          test -n "$SDIST_ROOT"
          (
            cd "$SDIST_ROOT"
            python -m pytest
            python tools/build_release.py --out-dir .rebuild --epoch "${{ steps.distributions.outputs.epoch }}"
          )
          cmp "$SDIST_ROOT"/.rebuild/cpython_extensions-*.whl dist/cpython_extensions-*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions-${{ steps.version.outputs.version }}-${{ steps.version.outputs.channel }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions-${{ needs.build.outputs.version }}-${{ needs.build.outputs.channel }}
          path: dist

      - name: Verify downloaded release artifact
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      # Use GitHub's REST API through github-script rather than gh CLI state.
      # This is idempotent: matching assets are retained, missing assets are
      # uploaded, stale preview assets are repaired, and stable assets are
      # never overwritten if their certified bytes differ.
      - name: Create or verify GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE_DIR: dist
        with:
          github-token: ${{ github.token }}
          script: |
            const publishRelease = require('./.github/scripts/publish_release.cjs');
            await publishRelease({ github, context, core });

  pypi-publish:
    name: PyPI Trusted Publishing
    # Preview/test tags such as v1.0.3-beta exercise build + GitHub prerelease,
    # but only the exact v<package-version> stable tag can ever reach PyPI.
    if: ${{ needs.build.outputs.channel == 'stable' }}
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cpython-extensions
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions-${{ needs.build.outputs.version }}-${{ needs.build.outputs.channel }}
          path: dist

      - name: Verify distributions before PyPI
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Stage only publishable distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pypi-dist
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          test "$(find pypi-dist -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -e pypi-dist/SHA256SUMS.txt

      - name: Publish certified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          print-hash: true
