name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: reproducible sdist and manylinux artifact certification
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Run before installing/building anything. Installing the local project
      # creates build metadata that intentionally fails the clean-tree gate.
      - name: Check clean repository and tag version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_repo.py
          VERSION=$(python tools/check_version.py --tag "$GITHUB_REF_NAME")
          CHANNEL=$(python tools/check_version.py --tag "$GITHUB_REF_NAME" --print-channel)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release tag $GITHUB_REF_NAME accepted as $CHANNEL for package $VERSION"

      # Resolve project-declared release dependencies without installing the
      # local package. cibuildwheel is pinned separately because it is CI
      # infrastructure rather than a package runtime/build dependency.
      - name: Install declared release dependencies
        run: >-
          python tools/install_dependencies.py
          --include-build-system
          --include-runtime
          --upgrade
          build test

      - name: Install Linux wheel release tooling
        run: python -m pip install "cibuildwheel==4.1.1"

      - name: Validate publish metadata
        run: python tools/check_metadata.py

      - name: Report release tooling
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m twine --version
          python -m cibuildwheel --version
          python -m pip check

      # tools/build_release.py still creates a host-native wheel as an internal
      # by-product. That raw *-linux_x86_64.whl is NEVER staged or published.
      # Only the canonical sdist from this step proceeds to cibuildwheel.
      - name: Build reproducible canonical sdist twice
        id: distributions
        shell: bash
        run: |
          set -euo pipefail

          EPOCH=$(git show -s --format=%ct HEAD)
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
          export SOURCE_DATE_EPOCH="$EPOCH"

          rm -rf dist-a dist-b dist
          python tools/build_release.py --out-dir dist-a --epoch "$EPOCH"
          python tools/build_release.py --out-dir dist-b --epoch "$EPOCH"

          cmp dist-a/cpython_extensions-*.tar.gz dist-b/cpython_extensions-*.tar.gz

          mkdir dist
          cp dist-a/cpython_extensions-*.tar.gz dist/

          # Explicitly prove that the raw host wheel is not being staged.
          test ! -e dist/cpython_extensions-*-linux_x86_64.whl

          rm -rf dist-a dist-b

      # Build from the exact canonical sdist, not from a separate checkout.
      # On Linux cibuildwheel builds inside the selected manylinux container
      # and repairs the resulting binary wheel before returning it.
      - name: Build manylinux wheel twice from exact sdist
        shell: bash
        env:
          CIBW_BUILD: cp313-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: "1"
        run: |
          set -euo pipefail

          SDIST=$(find dist -maxdepth 1 -type f -name 'cpython_extensions-*.tar.gz' -print -quit)
          test -n "$SDIST"

          rm -rf wheelhouse-a wheelhouse-b

          # cibuildwheel automatically passes SOURCE_DATE_EPOCH into Linux
          # containers when it is present in the host environment.
          python -m cibuildwheel "$SDIST" \
            --platform linux \
            --output-dir wheelhouse-a

          python -m cibuildwheel "$SDIST" \
            --platform linux \
            --output-dir wheelhouse-b

          test "$(find wheelhouse-a -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find wheelhouse-b -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1

          WHEEL_A=$(find wheelhouse-a -maxdepth 1 -type f -name '*.whl' -print -quit)
          WHEEL_B=$(find wheelhouse-b -maxdepth 1 -type f -name '*.whl' -print -quit)

          test "$(basename "$WHEEL_A")" = "$(basename "$WHEEL_B")"
          cmp "$WHEEL_A" "$WHEEL_B"

          cp "$WHEEL_A" dist/
          rm -rf wheelhouse-a wheelhouse-b

      # PyPI rejects raw "linux_x86_64" binary wheels. This gate prevents the
      # release workflow from ever reaching GitHub Release or PyPI with one.
      - name: Validate publishable Linux platform tag
        shell: bash
        run: |
          set -euo pipefail

          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

          if find dist -maxdepth 1 -type f -name '*-linux_x86_64.whl' | grep -q .; then
            echo "ERROR: raw linux_x86_64 wheel must never be published to PyPI"
            find dist -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi

          if ! find dist -maxdepth 1 -type f -name '*manylinux*x86_64.whl' | grep -q .; then
            echo "ERROR: expected a repaired manylinux x86_64 wheel"
            find dist -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi

          echo "Publishable wheel:"
          find dist -maxdepth 1 -type f -name '*.whl' -print

      # Checksums must describe the final publishable artifacts, not the raw
      # setuptools wheel that was discarded earlier.
      - name: Generate final release checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify release checksums
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Validate package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      # Exercise the exact repaired manylinux wheel that will be uploaded.
      - name: Test exact manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wheel-install
          python -m pip install --target .wheel-install dist/*.whl
          PYTHONPATH=.wheel-install python tools/smoke_release.py

      # The wheel above was already built twice directly from this canonical
      # sdist. Here we separately prove that the source archive is complete,
      # testable, and reproducible after extraction in a different directory.
      - name: Test and reproduce exact sdist
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .sdist-test
          mkdir .sdist-test
          tar -xzf dist/cpython_extensions-*.tar.gz -C .sdist-test

          SDIST_ROOT=$(find .sdist-test \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name 'cpython_extensions-*' \
            -print -quit)

          test -n "$SDIST_ROOT"

          (
            cd "$SDIST_ROOT"
            python -m pytest
            python tools/build_release.py \
              --out-dir .rebuild \
              --epoch "${{ steps.distributions.outputs.epoch }}"
          )

          cmp \
            "$SDIST_ROOT"/.rebuild/cpython_extensions-*.tar.gz \
            dist/cpython_extensions-*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions-${{ steps.version.outputs.version }}-${{ steps.version.outputs.channel }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-distributions-${{ needs.build.outputs.version }}-${{ needs.build.outputs.channel }}
          path: dist

      - name: Verify downloaded release artifact
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Refuse non-PyPI Linux wheel tags
        shell: bash
        run: |
          set -euo pipefail

          if find dist -maxdepth 1 -type f -name '*-linux_x86_64.whl' | grep -q .; then
            echo "ERROR: GitHub Release contains a forbidden raw linux_x86_64 wheel"
            exit 1
          fi

          find dist -maxdepth 1 -type f -name '*manylinux*x86_64.whl' | grep -q .

      # Use GitHub's REST API through github-script rather than gh CLI state.
      # This is idempotent: matching assets are retained, missing assets are
      # uploaded, stale preview assets are repaired, and stable assets are
      # never overwritten if their certified bytes differ.
      - name: Create or verify GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE_DIR: dist
        with:
          github-token: ${{ github.token }}
          script: |
            const publishRelease = require('./.github/scripts/publish_release.cjs');
            await publishRelease({ github, context, core });

  pypi-publish:
    name: PyPI Trusted Publishing

    # Preview/test tags such as v<package-version>-beta exercise the complete
    # build and GitHub prerelease path, but only the exact stable tag can reach
    # PyPI. The pypi environment remains the explicit approval/protection gate.
    if: ${{ needs.build.outputs.channel == 'stable' }}
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cpython-extensions
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions-${{ needs.build.outputs.version }}-${{ needs.build.outputs.channel }}
          path: dist

      - name: Verify distributions before PyPI
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Validate PyPI payload
        shell: bash
        run: |
          set -euo pipefail

          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

          if find dist -maxdepth 1 -type f -name '*-linux_x86_64.whl' | grep -q .; then
            echo "ERROR: refusing to stage unsupported raw linux_x86_64 wheel"
            exit 1
          fi

          find dist -maxdepth 1 -type f -name '*manylinux*x86_64.whl' | grep -q .

      - name: Stage only publishable distributions
        shell: bash
        run: |
          set -euo pipefail

          rm -rf pypi-dist
          mkdir pypi-dist

          cp dist/*.whl dist/*.tar.gz pypi-dist/

          test "$(find pypi-dist -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -e pypi-dist/SHA256SUMS.txt

          echo "PyPI payload:"
          ls -lh pypi-dist/

      - name: Publish certified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          print-hash: true
